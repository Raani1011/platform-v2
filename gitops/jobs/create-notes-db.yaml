apiVersion: batch/v1
kind: Job
metadata:
  name: create-notes-db
  namespace: platform
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          image: postgres:17-alpine
          env:
            - name: PGHOST
              value: "${RDS_HOST}"
            - name: PGDATABASE
              value: users_db
            - name: PGSSLMODE
              value: require
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD
          command:
            - sh
            - -c
            - |
              psql -tAc "SELECT 1 FROM pg_database WHERE datname='notes_db'" | grep -q 1 \
                && echo "notes_db already exists" \
                || psql -c "CREATE DATABASE notes_db;"
              echo "---- Databases on RDS ----"
              psql -tAc "SELECT datname FROM pg_database WHERE datistemplate = false;"
