apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: users-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Raani1011/platform-v2.git
    targetRevision: main
    path: gitops/charts/platform-service
    helm:
      releaseName: users-service
      valueFiles:
        - ../../values/users-service.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
